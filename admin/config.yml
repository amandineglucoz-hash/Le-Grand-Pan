backend:
  name: github
  repo: amandineglucoz-hash/Le-Grand-Pan
  branch: main

media_folder: "le-grand-pan-assets"
public_folder: "le-grand-pan-assets"

locale: fr

collections:
  - name: "modale"
    label: "Modale alerte"
    files:
      - name: "modale"
        label: "Modale alerte"
        file: "content/modale.json"
        fields:
          - { label: "Afficher la modale", name: "active", widget: "boolean", default: true, hint: "Désactiver pour masquer sans supprimer le contenu" }
          - { label: "Titre", name: "titre", widget: "string" }
          - { label: "Contenu (plats, prix...)", name: "contenu", widget: "text", hint: "Une ligne par article" }
          - { label: "Sous-texte (date limite, info)", name: "sous_texte", widget: "string", required: false }
          - { label: "Texte du bouton", name: "bouton_label", widget: "string" }
          - { label: "Lien du bouton", name: "bouton_lien", widget: "string", hint: "Ex: mailto:contact@legrandpan.fr ou une URL" }

  - name: "accueil"
    label: "Page d'accueil"
    files:
      - name: "hero"
        label: "Hero & Introduction"
        file: "content/hero.json"
        fields:
          - { label: "Image principale (header)", name: "image_header", widget: "image", hint: "1920x1080px recommandé" }
          - { label: "Titre principal", name: "titre", widget: "string" }
          - { label: "Texte d'accroche", name: "texte", widget: "text" }
          - { label: "Photo d'ambiance (section bienvenue)", name: "image_bienvenue", widget: "image" }
          - label: "Bouton de réservation"
            name: "bouton_reservation"
            widget: "object"
            fields:
              - { label: "Texte", name: "label", widget: "string" }
              - { label: "Lien", name: "lien", widget: "string" }

      - name: "menu"
        label: "Menu du restaurant"
        file: "content/menu.json"
        fields:
          - { label: "Image du menu", name: "image_menu", widget: "image" }
          - label: "Midi"
            name: "midi"
            widget: "object"
            fields:
              - label: "Formules"
                name: "formules"
                widget: "list"
                field: { label: "Formule", name: "texte", widget: "string" }
              - { label: "Suggestion du chef", name: "suggestion", widget: "text" }
              - label: "Les classiques"
                name: "classiques"
                widget: "list"
                field: { label: "Plat", name: "nom", widget: "string" }
          - label: "Soir"
            name: "soir"
            widget: "object"
            fields:
              - { label: "Suggestion du chef", name: "suggestion", widget: "text" }
              - label: "Les classiques"
                name: "classiques"
                widget: "list"
                field: { label: "Plat", name: "nom", widget: "string" }

      - name: "galerie"
        label: "Galerie photos (slider)"
        file: "content/galerie.json"
        fields:
          - label: "Photos du slider"
            name: "photos"
            widget: "list"
            hint: "Ajouter, supprimer ou réordonner les photos"
            fields:
              - { label: "Photo", name: "image", widget: "image", hint: "800x800px recommandé" }
              - { label: "Description (alt)", name: "alt", widget: "string", default: "Photo du restaurant Le Grand Pan" }

      - name: "infos"
        label: "Infos pratiques"
        file: "content/infos.json"
        fields:
          - { label: "Statut ouverture (ex: Nous sommes ouverts !)", name: "statut", widget: "string" }
          - label: "Horaires semaine"
            name: "horaires_semaine"
            widget: "object"
            fields:
              - { label: "Jours", name: "jours", widget: "string", default: "Lun - Ven" }
              - { label: "Horaires", name: "heures", widget: "string", default: "12h-14h / 19h30-23h" }
          - label: "Week-end"
            name: "horaires_weekend"
            widget: "object"
            fields:
              - { label: "Jours", name: "jours", widget: "string", default: "Dim - Samedi" }
              - { label: "Statut", name: "statut", widget: "string", default: "Fermé" }
          - { label: "Adresse", name: "adresse", widget: "string", default: "20 Rue Rosenwald" }
          - { label: "Téléphone", name: "telephone", widget: "string", default: "01 42 50 02 50" }
          - label: "Bouton réservation"
            name: "bouton_reservation"
            widget: "object"
            fields:
              - { label: "Texte", name: "label", widget: "string" }
              - { label: "Lien", name: "lien", widget: "string" }

      - name: "restaurateurs"
        label: "Nos restaurants (La Suite & Piennolo)"
        file: "content/restaurateurs.json"
        fields:
          - label: "La Suite"
            name: "lasuite"
            widget: "object"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Tag", name: "tag", widget: "string", default: "Salle privée" }
              - { label: "Titre", name: "titre", widget: "string", default: "Privatisation & réservation" }
              - { label: "Texte", name: "texte", widget: "text" }
              - { label: "Texte du bouton", name: "bouton_label", widget: "string" }
              - { label: "Lien du bouton", name: "bouton_lien", widget: "string" }
          - label: "Piennolo"
            name: "piennolo"
            widget: "object"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Tag", name: "tag", widget: "string", default: "Pizzeria" }
              - { label: "Titre", name: "titre", widget: "string", default: "Piennolo" }
              - { label: "Texte", name: "texte", widget: "text" }
              - { label: "Texte du bouton", name: "bouton_label", widget: "string" }
              - { label: "Lien du bouton", name: "bouton_lien", widget: "string" }

      - name: "parcours"
        label: "Parcours du chef"
        file: "content/parcours.json"
        fields:
          - { label: "Photo", name: "image", widget: "image" }
          - { label: "Accroche", name: "kicker", widget: "string" }
          - { label: "Texte", name: "texte", widget: "text", hint: "Un paragraphe par ligne. Balises <strong> possibles." }

      - name: "footer"
        label: "Footer & Instagram"
        file: "content/footer.json"
        fields:
          - { label: "Image de fond (section Instagram)", name: "image", widget: "image", hint: "Photo d'ambiance affichée derrière le bouton Instagram" }
          - { label: "Titre (ex: Suivez-nous)", name: "suivez", widget: "string", default: "Suivez-nous sur Instagram" }
          - { label: "Lien Instagram", name: "instagram", widget: "string", hint: "Ex: https://www.instagram.com/legrandpan" }

  # ════════════════════════════════════════
  # PIENNOLO
  # ════════════════════════════════════════

  - name: "piennolo_modale"
    label: "🍕 Piennolo – Modale note"
    files:
      - name: "piennolo_modale"
        label: "Modale note Google"
        file: "Piennolo/content/modale.json"
        fields:
          - { label: "Afficher la modale", name: "active", widget: "boolean", default: true }
          - { label: "Note (ex: 4,9)", name: "note", widget: "string" }
          - { label: "Note max (ex: 5)", name: "note_max", widget: "string", default: "5" }
          - { label: "Label qualité (ex: Excellent)", name: "label_qualite", widget: "string" }
          - { label: "Texte avis (ex: Note Google sur 514 avis)", name: "label_avis", widget: "string" }
          - { label: "Texte du bouton", name: "bouton_label", widget: "string", default: "Réserver" }
          - { label: "Lien du bouton", name: "bouton_lien", widget: "string" }

  - name: "piennolo_accueil"
    label: "🍕 Piennolo – Contenu"
    files:
      - name: "piennolo_hero"
        label: "Image Header"
        file: "Piennolo/content/hero.json"
        fields:
          - { label: "Image desktop", name: "image_header", widget: "image", hint: "1920px de large recommandé" }
          - { label: "Image mobile (optionnelle)", name: "image_header_mobile", widget: "image", required: false }

      - name: "piennolo_bienvenue"
        label: "Section Bienvenue (Come a Casa)"
        file: "Piennolo/content/bienvenue.json"
        fields:
          - { label: "Titre", name: "titre", widget: "string", default: "Come a Casa" }
          - { label: "Paragraphe 1", name: "texte_1", widget: "text" }
          - { label: "Paragraphe 2", name: "texte_2", widget: "text" }
          - { label: "Photo principale (pizza)", name: "image_1", widget: "image" }
          - { label: "Photo droite (antipasti)", name: "image_2", widget: "image" }
          - { label: "Photo gauche (cucina)", name: "image_3", widget: "image" }

      - name: "piennolo_menu"
        label: "Menu (A Tavola!)"
        file: "Piennolo/content/menu.json"
        fields:
          - { label: "Titre du menu", name: "titre", widget: "string", default: "A Tavola!" }
          - label: "Antipastis"
            name: "antipasti"
            widget: "list"
            fields:
              - { label: "Nom du plat", name: "nom", widget: "string" }
              - { label: "Badge", name: "badge", widget: "select", options: ["", "vege", "poisson", "piquant"], default: "", hint: "Laisser vide si aucun badge" }
          - label: "Pizzas"
            name: "pizzas"
            widget: "list"
            fields:
              - { label: "Nom du plat", name: "nom", widget: "string" }
              - { label: "Badge", name: "badge", widget: "select", options: ["", "vege", "poisson", "piquant"], default: "" }
          - label: "Desserts"
            name: "desserts"
            widget: "list"
            fields:
              - { label: "Nom du plat", name: "nom", widget: "string" }
              - { label: "Badge", name: "badge", widget: "select", options: ["", "vege", "poisson", "piquant"], default: "" }

      - name: "piennolo_chef"
        label: "Section Chef (Arte Pizzaiola)"
        file: "Piennolo/content/chef.json"
        fields:
          - { label: "Titre", name: "titre", widget: "string" }
          - { label: "Texte principal", name: "texte", widget: "text" }
          - { label: "Sous-texte (chef)", name: "sous_texte", widget: "string" }
          - { label: "Image de fond", name: "image_bg", widget: "image" }

      - name: "piennolo_galerie"
        label: "Galerie photos (slider)"
        file: "Piennolo/content/galerie.json"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            fields:
              - { label: "Photo", name: "image", widget: "image", hint: "800x800px recommandé" }
              - { label: "Description (alt)", name: "alt", widget: "string", default: "Photo Piennolo" }

  - name: "piennolo_infos"
    label: "🍕 Piennolo – Infos pratiques"
    files:
      - name: "piennolo_infos"
        label: "Horaires & Contact"
        file: "Piennolo/content/infos.json"
        fields:
          - { label: "Message quand ouvert", name: "msg_ouvert", widget: "string", default: "Nous sommes ouverts !" }
          - { label: "Message quand fermé", name: "msg_ferme", widget: "string" }
          - label: "Horaires machine (calcul ouvert/fermé)"
            name: "horaires_machine"
            widget: "list"
            hint: "Jours: 0=dim, 1=lun, 2=mar, 3=mer, 4=jeu, 5=ven, 6=sam"
            fields:
              - { label: "Jours (tableau)", name: "jours", widget: "list", field: { label: "Jour", name: "jour", widget: "number" } }
              - { label: "Heure début (HH:MM)", name: "debut", widget: "string" }
              - { label: "Heure fin (HH:MM)", name: "fin", widget: "string" }
          - label: "Horaires affichés"
            name: "horaires_display"
            widget: "list"
            fields:
              - { label: "Jours", name: "jours", widget: "string" }
              - { label: "Heures", name: "heures", widget: "string" }
          - { label: "Adresse", name: "adresse", widget: "string" }
          - { label: "Ville", name: "ville", widget: "string", default: "75 015 Paris" }
          - { label: "Téléphone", name: "telephone", widget: "string" }
          - label: "Bouton réservation"
            name: "bouton_reservation"
            widget: "object"
            fields:
              - { label: "Texte", name: "label", widget: "string" }
              - { label: "Lien", name: "lien", widget: "string" }

  - name: "piennolo_footer"
    label: "🍕 Piennolo – Footer"
    files:
      - name: "piennolo_footer"
        label: "Footer & Instagram"
        file: "Piennolo/content/footer.json"
        fields:
          - { label: "Titre (ex: Suivez-nous !)", name: "titre", widget: "string" }
          - { label: "Lien Instagram", name: "instagram", widget: "string" }
          - { label: "Image de fond", name: "image", widget: "image" }
